# Publishes a release when a version tag is pushed (e.g. v0.3.0, made by `npm run release`).
# The release holds the installers and latest.json, which installed copies of Milo read to
# offer the update. Update bundles are signed with TAURI_SIGNING_PRIVATE_KEY (a repo secret);
# Milo only accepts updates signed with the matching key.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Test the data layer
        working-directory: src-tauri
        run: cargo test

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Milo ${{ github.ref_name }}
          releaseBody: "Windows: install with the -setup.exe file. After that, Milo offers new versions itself (Settings > Updates)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
